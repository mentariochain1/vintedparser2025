[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "vinted-parser-bot"
version = "0.1.0"
description = "Telegram bot for parsing Vinted listings that ship to Austria"
authors = [
    {name = "Bot Developer", email = "dev@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Core Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.2.0",
    
    # Telegram Bot
    "aiogram>=3.10.0",
    
    # HTTP Client
    "httpx>=0.27.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "supabase>=2.0.0",
    
    # Cache and Queue
    "redis>=5.0.0",
    "aiometer>=0.5.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Vinted Integration
    "vinted-api-wrapper>=0.3.9",
    "cloudscraper>=1.2.71",
    "requests>=2.31.0",
    
    # Payment Processing
    "yookassa>=3.6.0",
    
    # Utilities
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.8.2",
    
    # Monitoring
    "prometheus-client>=0.19.0",
    
    # Async Support
    "asyncio-mqtt>=0.16.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "aiogram-tests>=1.0.3",
    "respx>=0.20.0",

    
    # Code Quality
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    
    # Type Stubs
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.8.0",
    
    # Development Tools
    "pre-commit>=3.6.0",
    "tox>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/example/vinted-parser-bot"
Repository = "https://github.com/example/vinted-parser-bot"
Issues = "https://github.com/example/vinted-parser-bot/issues"

[project.scripts]
vinted-bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "vinted.*",
    "yookassa.*",
    "aiogram_tests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "slow: marks tests as slow",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true