# Supabase configuration file

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
port = 54325
image_transformation = {
  enabled = true
}

[auth]
enabled = true
port = 54326
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_email_confirmations = false
enable_sms_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Use pre-defined users for local development
[[auth.users]]
email = "admin@example.com"
password = "password"
email_confirm = true

[edge_functions]
enabled = true
port = 54327

[analytics]
enabled = false
port = 54328
vector_port = 54329
gcp_project_id = ""
gcp_project_number = ""
gcp_jwt_path = "supabase/gcp.json"